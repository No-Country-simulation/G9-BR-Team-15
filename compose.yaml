version: '3.8'

services:
  # 1. Banco de Dados
  mysql-db:
    image: mysql:8.0
    container_name: lumen_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - lumen_data:/var/lib/mysql
    networks:
      - lumen_network

  # 2. Serviço de Machine Learning (FastAPI)
  ml-service:
    build: 
      context: ./ml-service
    container_name: lumen_ml
    restart: always
    ports:
      - "8000:8000"
    networks:
      - lumen_network

  # 3. Backend Principal (Spring Boot)
  api-backend:
    build:
      context: ./backend
    container_name: lumen_api
    restart: always
    ports:
      # Puxa a porta do .env. Se não existir, usa a 8080 por padrão
      - "${API_PORT:-8080}:8080"
    environment:
      # Injetando as variáveis no Spring Boot
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - lumen-db
      - ml-service
    networks:
      - lumen_network

volumes:
  mysql_data:

networks:
  energia_network:
    driver: bridge